# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a1debf156031117bd530b5f7c9a1a977"
name = "dev-custom-app"
application_url = "https://de1ef2d56f29d5550cbda6b09defda86.loophole.site"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_cart_transforms,read_products,unauthenticated_read_metaobjects,write_cart_transforms,write_metaobject_definitions,write_metaobjects,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://de1ef2d56f29d5550cbda6b09defda86.loophole.site/auth/callback",
  "https://de1ef2d56f29d5550cbda6b09defda86.loophole.site/auth/shopify/callback",
  "https://de1ef2d56f29d5550cbda6b09defda86.loophole.site/api/auth/callback"
]

[metaobjects.app.bundle_config]
name = "Bundle config"
description = "Bundle components, parent variant, and fixed price for cart transform"
display_name_field = "bundle_title"

  [metaobjects.app.bundle_config.access]
  admin = "merchant_read_write"

[metaobjects.app.bundle_config.fields.component_variants]
name = "Component variants"
type = "json"
required = true

[metaobjects.app.bundle_config.fields.parent_variant]
name = "Parent variant"
type = "variant_reference"
required = true

[metaobjects.app.bundle_config.fields.fixed_price]
name = "Fixed price"
type = "number_decimal"
required = true

[metaobjects.app.bundle_config.fields.bundle_title]
name = "Bundle title"
type = "single_line_text_field"
