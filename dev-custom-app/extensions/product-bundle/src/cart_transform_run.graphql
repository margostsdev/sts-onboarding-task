query CartTransformRunInput {
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            title
            bundleRecipe: metafield(namespace: "$app", key: "bundle") {
              jsonValue
            }
          }
        }
      }
    }
  }
}
